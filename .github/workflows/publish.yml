# Stages a release on npm when a GitHub release is published. No token: npm
# trusts this workflow in this repository (trusted publishing). A staged
# version goes live only once the owner approves it with two-factor.
name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: node --test test/client.test.mjs
      - run: npm stage publish --access public
